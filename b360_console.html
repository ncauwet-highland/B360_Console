<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT}} Console</title>
<!--
  Terminal page for the {{PRODUCT}} console application.

  Line-oriented on purpose. The device never emits an escape sequence and does
  not echo -- loopback.c says so and tells clients to use local echo -- so a
  VT100 screen-grid emulator would sit entirely unexercised. The only terminal
  behaviour worth having is honouring a bare CR as an overwrite and dropping
  stray escape bytes instead of printing them as mojibake.

  All I/O goes through window.pywebview.api, which owns the one connection the
  board allows.
-->
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1d2126; --dim:#666e78;
  --line:#d6dae0; --accent:#2f7fd0; --ok:#2aa05a; --err:#c4384f;
  --field:#fff; --hover:#eef2f7;
  /* The scrollback follows the theme too -- a light chrome with a dark pane was
     the "somewhat mixed" look this replaces. */
  --term-bg:#fdfdfe; --term-ink:#1d2126; --term-dim:#79818b;
  --t-cmd:#1b5e9e; --t-err:#c4384f;
  --t-plot-bg:#eef6ee; --t-plot-fg:#1f6b3a; --t-plot-line:#bcd8c2;
  /* Were hardcoded; tokens so the colour wheel can solve them too. Same values
     in both Light and Dark, as before. */
  --on-accent:#fff; --accent-hover:#2569ad;
  --dot-idle:#c4c9d0; --dot-busy:#e2a11d; --shadow:rgba(0,0,0,.20);
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  --bg:#14181d; --panel:#1c2128; --ink:#d6dbe1; --dim:#8b949e;
  --line:#2d333b; --accent:#4a9eea; --ok:#3fb950; --err:#ff8b8b;
  --field:#0f1317; --hover:#262c34;
  --term-bg:#0f1317; --term-ink:#d6dbe1; --term-dim:#7d8590;
  --t-cmd:#8fc2f0; --t-err:#ff8b8b;
  --t-plot-bg:#2a313a; --t-plot-fg:#9fd0a0; --t-plot-line:#3a4550;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
     font:13px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none;
       padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:14px;font-weight:600;margin:0 6px 0 0;white-space:nowrap}
button,select,input{font:inherit;color:inherit;background:var(--field);
       border:1px solid var(--line);border-radius:5px;padding:4px 9px}
button{cursor:pointer}
button:hover:not(:disabled){background:var(--hover);border-color:var(--dim)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.pri:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
#host{width:190px}
#port{width:74px}
#serialport{min-width:170px}
.spacer{flex:1}
#dot{width:9px;height:9px;border-radius:50%;background:var(--dot-idle);flex:none}
#dot.on{background:var(--ok)}
#dot.busy{background:var(--dot-busy)}
#dot.stale{background:var(--dot-idle)}
#state{color:var(--dim);white-space:nowrap}
#term{flex:1;min-height:0;overflow:auto;background:var(--term-bg);color:var(--term-ink);
      font:12.5px/1.5 var(--mono);padding:10px 12px;white-space:pre-wrap;
      word-break:break-word;overflow-wrap:anywhere}
/* Only the transcript is selectable, and inside it only the traffic: what was
   sent and what came back. The host's own chatter and the Plot button are not
   part of a session and should not land in a paste. Chrome drops a
   user-select:none element out of a selection that spans it, so dragging across
   one copies the lines either side without it.
   The blanket rule undoes pywebview's text_select=True, which turns selection on
   for the whole body (webview/js/customize.js:4-5). */
body{user-select:none}
#term{user-select:text}
#term .note,
#term .plot{user-select:none}
#term .cmd{color:var(--t-cmd)}
#term .err{color:var(--t-err);font-weight:var(--t-err-weight,normal)}
#term .note{color:var(--term-dim);font-style:italic}
#term.quiet .note{display:none}
#term .plot{display:inline-block;margin:4px 0;padding:2px 9px;border-radius:5px;
      border:1px solid var(--t-plot-line);background:var(--t-plot-bg);
      color:var(--t-plot-fg);cursor:pointer;font:inherit}
#term .plot:hover{filter:brightness(1.08)}
footer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;
       background:var(--panel);border-top:1px solid var(--line)}
#prompt{font:13px var(--mono);color:var(--dim)}
#entry{flex:1;font:13px var(--mono)}
#entry:disabled{background:var(--bg)}
.barrow{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
        padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);
        color:var(--dim);font-size:11.5px}
.barrow code{font-family:var(--mono)}
#capdirc{font-family:var(--mono);word-break:break-all;color:var(--ink)}
.barrow button{padding:2px 8px;font-size:11.5px}
.barrow label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
/* Right-click menu for the transcript. WebView2's own menu is disabled unless
   pywebview is in debug mode, so the page provides one. */
#ctx{position:fixed;z-index:60;display:none;flex-direction:column;min-width:128px;
     background:var(--panel);border:1px solid var(--line);border-radius:6px;
     padding:4px;box-shadow:0 6px 18px var(--shadow)}
#ctx.on{display:flex}
#ctx button{border:0;background:none;text-align:left;padding:5px 10px;
     border-radius:4px;font:inherit;color:inherit;cursor:pointer}
#ctx button:hover:not(:disabled){background:var(--hover)}
#ctx button:disabled{opacity:.45;cursor:default}

/* ------------------------------------------------- colour wheel products ---
   Everything below applies only with data-appearance="wheel", so a Light/Dark
   product renders exactly as before. paletteFrom() sets the colour tokens; these
   rules cover what the browser would otherwise colour on its own, which a
   custom background can make unreadable. */
#colorbtn:not([hidden]){display:inline-flex;align-items:center;gap:6px}
#colorbtn i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);
     background:var(--panel)}
:root[data-appearance="wheel"] ::selection{background:var(--ink);color:var(--field)}
:root[data-appearance="wheel"] #term ::selection{background:var(--term-ink);color:var(--term-bg)}
:root[data-appearance="wheel"] ::placeholder{color:var(--dim);opacity:1}
:root[data-appearance="wheel"] option{background:var(--field);color:var(--ink)}
:root[data-appearance="wheel"] :focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* The dot sits in a field-coloured ring with a border round it: its fill is
   solved against the ring, so green/amber/grey keep their hue on any window
   colour instead of all collapsing to black or white on a mid-tone. */
:root[data-appearance="wheel"] #dot{box-shadow:0 0 0 2px var(--field),0 0 0 3px var(--line);
     margin:0 3px}
#picker{position:fixed;z-index:70;display:none;flex-direction:column;gap:8px;
     width:236px;padding:10px;background:var(--panel);color:var(--ink);
     border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px var(--shadow)}
#picker.on{display:flex}
#wheel{width:214px;height:214px;align-self:center;cursor:crosshair;touch-action:none}
#picker label{display:flex;align-items:center;gap:8px;color:var(--dim)}
#picker input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
#hex{width:90px;font-family:var(--mono)}
#presets{display:flex;flex-wrap:wrap;gap:6px}
#presets button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid var(--line)}
#picker .row{display:flex;align-items:center;gap:8px}
#picknote{color:var(--dim);font-size:11.5px;min-height:1em}
</style>
</head>
<body>

<header>
  <h1>{{PRODUCT}} Console</h1>
  <select id="kind">
    <option value="tcp">TCP</option>
    <option value="serial">USB serial</option>
  </select>
  <span id="tcpfields">
    <input type="text" id="host" placeholder="192.168.0.25 or {{PRODUCT}}-1234.local">
    <input type="number" id="port" value="5007" title="TCP command port (5007)">
  </span>
  <span id="serialfields" hidden>
    <select id="serialport"></select>
    <button id="rescan" title="rescan ports">&#8635;</button>
  </span>
  <select id="eol" title="what Enter sends; over USB a CRLF terminates twice and draws an extra reply">
    <option value="crlf">CR+LF</option>
    <option value="cr">CR</option>
    <option value="lf">LF</option>
  </select>
  <button class="pri" id="connect">Connect</button>
  <span id="dot"></span><span id="state">not connected</span>
  <span class="spacer"></span>
  <select id="theme" title="applies to this window and the waveform window">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <button id="colorbtn" hidden title="window colour"><i></i>Colour</button>
  <button id="plotwin">Waveform window</button>
  <button id="clear">Clear</button>
  <label title="the app's own grey lines -- captures, auto-save, connection notices. Commands and board replies are never hidden."><input
    type="checkbox" id="actlog" checked> activity log</label>
</header>

<div id="term" tabindex="0"></div>

<footer>
  <span id="prompt">&gt;</span>
  <input type="text" id="entry" autocomplete="off" spellcheck="false" disabled
         placeholder="connect first">
  <button id="send" disabled>Send</button>
</footer>
<div class="barrow" id="capbar">
  <span>Captures:</span><span id="capdirc">&mdash;</span>
  <button id="capdirbtn">Change folder&hellip;</button>
  <label><input type="checkbox" id="capauto" checked> auto-save</label>
</div>
<div class="barrow">Up/Down for history &middot; Enter alone asks the board what it is
  &middot; several commands per line separated by <code>;</code><span id="wfhint">
  &middot; a <code>WR</code> reply can be plotted from the scrollback</span></div>

<div id="picker" role="dialog" aria-label="window colour">
  <canvas id="wheel" width="214" height="214"></canvas>
  <label>Brightness <input type="range" id="bright" min="0" max="100" value="100"></label>
  <div class="row"><input type="text" id="hex" maxlength="7" spellcheck="false">
    <span class="spacer"></span><button id="colreset">Reset</button></div>
  <div id="presets"></div>
  <div id="picknote"></div>
</div>

<div id="ctx">
  <button data-act="copy">Copy</button>
  <button data-act="selall">Select all</button>
</div>

<script>
'use strict';

var $ = function(id){ return document.getElementById(id); };
var term = $('term');

/* Optional GUI panels this product was built with; the host tells us in
   get_defaults(). Empty means terminal only, and the elements those panels own
   are removed rather than left to fail. */
var panelsOn = [];
function hasPanel(id){ return panelsOn.indexOf(id) >= 0; }

var connected = false;
var busy = false;
var cmdHistory = [];   /* not `history`: that is window.history, and assigning
                         to it under strict mode throws and kills the script */
var histIdx = 0;
var pending = '';          /* what the user was typing before browsing history */

/* ------------------------------------------------------------- scrollback --- */

var MAX_NODES = 4000;      /* bounded so a long session cannot grow forever */

function atBottom(){
  return term.scrollHeight - term.scrollTop - term.clientHeight < 24;
}

function write(text, cls){
  if (text === '') return;
  var stick = atBottom();
  var span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  term.appendChild(span);
  while (term.childNodes.length > MAX_NODES) term.removeChild(term.firstChild);
  if (stick) term.scrollTop = term.scrollHeight;
}

function writeLine(text, cls){ write(text + '\n', cls); }

/**
 * Make device output printable.
 *
 * Strips escape sequences rather than rendering them as mojibake -- the device
 * does not send any, but a wrong baud rate or a half-read reply can produce
 * stray bytes. CR/LF pairs arrive both ways round: replies use "\r\n" and ID
 * uses "\n\r", so both collapse to one newline. A surviving bare CR keeps its
 * terminal meaning of "overwrite this line".
 */
function clean(s){
  s = s.replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, '')
       .replace(/\x1b[@-_]/g, '')
       .replace(/[\x00\x07\x0b\x0c]/g, '');
  s = s.replace(/\r\n|\n\r/g, '\n');
  return s.split('\n').map(function(line){
    var i = line.lastIndexOf('\r');
    return i < 0 ? line : line.slice(i + 1);
  }).join('\n');
}

/* ------------------------------------------------------------------ state --- */

function setState(text, mode){
  $('state').textContent = text;
  var dot = $('dot');
  dot.className = mode || '';
}

function setBusy(on){
  busy = on;
  $('entry').disabled = on || !connected;
  $('send').disabled = on || !connected;
  $('connect').disabled = on;
  if (on) setState('working…', 'busy');
  else if (connected) setState('connected', 'on');
  if (!on && connected) $('entry').focus();
}

function setConnected(on, label){
  connected = on;
  $('connect').textContent = on ? 'Disconnect' : 'Connect';
  $('connect').classList.toggle('pri', !on);
  $('entry').disabled = !on;
  $('send').disabled = !on;
  $('entry').placeholder = on ? 'type a command' : 'connect first';
  $('kind').disabled = on;
  setState(on ? (label || 'connected') : 'not connected', on ? 'on' : '');
  if (on) $('entry').focus();
}

/* -------------------------------------------------------------- api bridge --- */

var BRIDGE_MSG = 'a web browser cannot open a TCP or serial connection \u2014 '
               + 'run {{BINARY}}';

/* Inside the app this is the real bridge. Opened as a file in a browser there
   is none, so hand back a stand-in whose every call rejects. Each call site
   already has a .catch, so the UI unwinds instead of freezing half-way
   through "connecting..." with no error and no timeout. */
var bridgeStub = null;
function api(){
  if (window.pywebview && window.pywebview.api) return window.pywebview.api;
  if (!bridgeStub){
    bridgeStub = {};
    ['get_defaults', 'list_serial', 'connect', 'disconnect', 'send', 'set_eol',
     'set_theme', 'set_window_color', 'capture', 'save_capture', 'plot_text', 'show_plot',
     'save_csv', 'choose_save_dir', 'set_autosave',
     'set_activity_log'].forEach(function(m){
      bridgeStub[m] = function(){ return Promise.reject(new Error(BRIDGE_MSG)); };
    });
  }
  return bridgeStub;
}

function fail(prefix, err){
  writeLine(prefix + ': ' + (err && err.message ? err.message : err), 'err');
}

/* ----------------------------------------------------------------- theme --- */

/** Apply a theme locally. The host is what keeps both windows in step. */
function setTheme(mode){
  if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('theme').value = (mode === 'dark') ? 'dark' : 'light';
}
window.b360_set_theme = setTheme;

/* ---------------------------------------------------------- colour wheel --- */

/* Products built with appearance "wheel" replace Light/Dark with a picked
   window colour. Every other colour is DERIVED from it, and each one is solved
   to a minimum WCAG contrast against what it sits on:

     text in the terminal           7:1
     any other text                 4.5:1  (incl. dim text, commands, errors)
     borders, status dot, accent    3:1

   The header and footer take the picked colour exactly. Text on a mid-tone
   (around #777) cannot reach 7:1 in either black or white -- the ceiling there
   is about 4.6:1 -- so the terminal pane takes the same hue, moved lighter or
   darker only as far as 7:1 needs. For most colours it is not moved at all.

   b360_contrast_sweep() runs the CONTRAST table over ~2600 colours; the host
   calls it for --contrast-sweep. */

var DEFAULT_WINDOW = '#ffffff';
var DARK_WINDOW = '#1c2128';    /* used once, for someone whose shared theme is Dark */

function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }

function hexToRgb(hex){
  var n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(c){
  return '#' + c.map(function(v){
    return ('0' + Math.round(v).toString(16)).slice(-2);
  }).join('');
}

/** h in degrees, s and l 0..1; returns a hex string. */
function hsl(h, s, l){
  var a = s * Math.min(l, 1 - l);
  function f(n){
    var k = (n + h / 30) % 12;
    return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)));
  }
  return rgbToHex([f(0), f(8), f(4)]);
}

function rgbToHsl(c){
  var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  var h = 0, l = (max + min) / 2;
  var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d){
    if (max === r) h = 60 * (((g - b) / d) % 6);
    else if (max === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  return [(h + 360) % 360, s, l];
}

/** The wheel is HSV (hue round, saturation out, brightness on the slider). */
function hsv(h, s, v){
  function f(n){
    var k = (n + h / 60) % 6;
    return 255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1)));
  }
  return rgbToHex([f(5), f(3), f(1)]);
}

function rgbToHsv(c){
  var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
  var max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  return [rgbToHsl(c)[0], max ? d / max : 0, max];
}

/** WCAG 2 relative luminance. */
function lum(hex){
  var c = hexToRgb(hex).map(function(v){
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

function contrast(a, b){
  var x = lum(a), y = lum(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}

function hueDist(a, b){
  var d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

/**
 * The colour of hue h and saturation s nearest lightness l0 that reaches
 * `target` against `bg`, on the side given by `dark` (true: darker than bg).
 *
 * Contrast only grows moving away from bg on one side, so a bisection between
 * l0 and the extreme finds the closest passing lightness. The extreme is pure
 * black or white whatever h and s are, which is the best there is, so it is
 * returned when nothing nearer passes. The small margin keeps a result rounded
 * to whole RGB steps above the line.
 */
function solve(h, s, l0, bg, target, dark){
  var lb = lum(bg);
  function ok(c){
    var y = lum(c);
    return (dark ? y <= lb : y >= lb) && contrast(c, bg) >= target + 0.02;
  }
  var c = hsl(h, s, l0);
  if (ok(c)) return c;
  var lo = l0, hi = dark ? 0 : 1, i;
  for (i = 0; i < 24; i++){
    var mid = (lo + hi) / 2;
    if (ok(hsl(h, s, mid))) hi = mid; else lo = mid;
  }
  return hsl(h, s, hi);
}

/** Black or white, whichever reads better on bg. */
function bestMono(bg){
  return contrast('#000000', bg) >= contrast('#ffffff', bg) ? '#000000' : '#ffffff';
}

/** sRGB mix; each channel lies between the two, so luminance does too. */
function mix(a, b, t){
  var x = hexToRgb(a), y = hexToRgb(b);
  return rgbToHex(x.map(function(v, i){ return v + (y[i] - v) * t; }));
}

/** Move a colour's lightness by d (clamped), keeping hue and saturation. */
function shift(hex, d){
  var q = rgbToHsl(hexToRgb(hex));
  return hsl(q[0], q[1], clamp01(q[2] + d));
}

/**
 * Derive the whole palette from one colour. Returns {tokens, scheme, shaded}:
 * the CSS custom properties, the color-scheme for native widgets (scrollbars,
 * drop-downs), and whether the terminal pane had to be moved off the picked
 * colour to keep its text at 7:1.
 */
function paletteFrom(pick){
  var q = rgbToHsl(hexToRgb(pick)), h = q[0], s = q[1];
  var dark = bestMono(pick) === '#000000';      /* dark TEXT, i.e. a light window */
  var away = dark ? 1 : -1;                     /* lightness direction away from text */
  var tint = Math.min(s, 0.25);
  var lText = dark ? 0.13 : 0.93;               /* starting lightness for text */
  var lMid  = dark ? 0.38 : 0.72;               /* ... for coloured text */
  var tinted = hsl(h, tint, lText);

  /* A colour near the picked hue can only be told apart by lightness. For a
     mark that is solved harder (the Connect button, a status dot). Text is not:
     4.5:1 already separates it from the window, and pushing harder only drives
     it into the plain text colour -- tried, and commands on a blue window came
     out navy next to near-black output. Instead a command line moves to another
     hue, and an error line, which must stay red, goes bold. */
  var clash = function(hue){ return s > 0.25 && hueDist(hue, h) < 35; };
  function need(hue, base){ return clash(hue) ? Math.max(base, 4.5) : base; }
  var cmdHue = clash(210) ? 270 : 210;

  var panel = pick;

  /* The terminal pane: the picked colour, moved away from the text only as far
     as 7.5:1 needs. The extra half leaves room for the coloured text below. */
  var termBg = pick, i;
  if (contrast(tinted, termBg) < 7.6){
    termBg = solve(h, s, q[2], tinted, 7.5, !dark);
  }
  /* Inputs and buttons share it. It lies further from the text than the panel
     does, so whatever reads on the panel reads at least as well in a field. */
  var field = termBg;
  var bg = mix(panel, field, 0.5);

  var ink = solve(h, tint, lText, panel, 7, dark);
  var dim = solve(h, Math.min(s, 0.12), lMid, panel, 4.5, dark);
  /* 3:1 is the WCAG minimum for a boundary; on a pale window that is a good
     deal firmer than the stock grey, which is the point. */
  var line = solve(h, Math.min(s, 0.2), dark ? 0.75 : 0.35, panel, 3, dark);

  var hover = shift(field, -away * 0.06);
  if (contrast(ink, hover) < 4.6) hover = shift(field, away * 0.06);

  var accent = solve(212, 0.65, dark ? 0.45 : 0.6, panel, need(212, 3), dark);
  var onAccent = bestMono(accent);
  var accentHover = shift(accent, onAccent === '#ffffff' ? -0.07 : 0.07);

  var termInk = solve(h, tint, lText, termBg, 7, dark);
  var termDim = solve(h, Math.min(s, 0.12), lMid, termBg, 4.5, dark);
  var tCmd = solve(cmdHue, 0.75, lMid, termBg, 4.5, dark);
  var tErr = solve(352, 0.72, lMid, termBg, 4.5, dark);

  var plotBg = shift(termBg, -away * 0.06);
  var plotFg = solve(140, 0.5, lMid, plotBg, 4.5, dark);
  var plotLine = solve(140, 0.3, dark ? 0.7 : 0.4, termBg, 3, dark);

  /* Status-dot fills, against the field-coloured ring they sit in. */
  var dotL = dark ? 0.45 : 0.6;
  var ok = solve(140, 0.6, dotL, field, need(140, 3), dark);
  var busyDot = solve(40, 0.85, dotL, field, need(40, 3), dark);
  var idle = solve(h, Math.min(s, 0.1), dark ? 0.7 : 0.4, field, 3, dark);

  return {
    scheme: dark ? 'light' : 'dark',
    shaded: termBg !== pick,
    tokens: {
      '--bg': bg, '--panel': panel, '--ink': ink, '--dim': dim, '--line': line,
      '--accent': accent, '--ok': ok, '--err': tErr, '--field': field,
      '--hover': hover, '--term-bg': termBg, '--term-ink': termInk,
      '--term-dim': termDim, '--t-cmd': tCmd, '--t-err': tErr,
      '--t-plot-bg': plotBg, '--t-plot-fg': plotFg, '--t-plot-line': plotLine,
      '--on-accent': onAccent, '--accent-hover': accentHover,
      '--dot-idle': idle, '--dot-busy': busyDot,
      '--t-err-weight': clash(352) ? '700' : '400',
      '--shadow': dark ? 'rgba(0,0,0,.22)' : 'rgba(0,0,0,.55)'
    }
  };
}

/* Every pairing the page actually draws: [text-or-mark, what it sits on, min]. */
var CONTRAST = [
  ['--ink', '--panel', 4.5],     /* 7 where possible; a mid-tone tops out ~4.6 */
  ['--ink', '--field', 4.5], ['--ink', '--hover', 4.5], ['--ink', '--bg', 4.5],
  ['--dim', '--panel', 4.5], ['--dim', '--field', 4.5], ['--dim', '--bg', 4.5],
  ['--line', '--panel', 3], ['--line', '--field', 3],
  ['--accent', '--panel', 3],
  ['--on-accent', '--accent', 4.5], ['--on-accent', '--accent-hover', 4.5],
  ['--term-ink', '--term-bg', 7],
  ['--term-dim', '--term-bg', 4.5], ['--t-cmd', '--term-bg', 4.5],
  ['--t-err', '--term-bg', 4.5],
  ['--t-plot-fg', '--t-plot-bg', 4.5], ['--t-plot-line', '--term-bg', 3],
  ['--ok', '--field', 3], ['--dot-busy', '--field', 3], ['--dot-idle', '--field', 3]
];

/** Check paletteFrom() over the whole wheel. Returns a plain object for the host. */
window.b360_contrast_sweep = function(){
  var fails = [], worst = {}, n = 0, h, si, vi;
  for (h = 0; h < 360; h += 10)
    for (si = 0; si <= 5; si++)
      for (vi = 0; vi <= 11; vi++){
        var pick = hsv(h, si / 5, vi / 11), t = paletteFrom(pick).tokens;
        n++;
        CONTRAST.forEach(function(c){
          var r = contrast(t[c[0]], t[c[1]]), key = c[0] + ' on ' + c[1];
          if (!(key in worst) || r < worst[key][0]) worst[key] = [r, pick, c[2]];
          if (r < c[2] && fails.length < 40)
            fails.push(pick + ': ' + key + ' ' + r.toFixed(2) + ' < ' + c[2]);
        });
      }
  return {colours: n, pairs: CONTRAST.length, failures: fails, worst: worst};
};

var windowColor = DEFAULT_WINDOW;

function applyWindowColor(pick){
  var p = paletteFrom(pick), root = document.documentElement;
  windowColor = pick;
  Object.keys(p.tokens).forEach(function(k){ root.style.setProperty(k, p.tokens[k]); });
  root.style.colorScheme = p.scheme;
  $('picknote').textContent = p.shaded
    ? 'Terminal shaded to keep its text at 7:1.' : '';
  return p;
}

/** Switch the page to wheel mode. Called once, from the host's answer. */
function applyAppearance(mode, saved, theme){
  if (mode !== 'wheel') return;
  document.documentElement.setAttribute('data-appearance', 'wheel');
  document.documentElement.removeAttribute('data-theme');
  $('theme').hidden = true;
  $('colorbtn').hidden = false;
  var pick = /^#[0-9a-f]{6}$/i.test(saved || '') ? saved.toLowerCase()
           : (theme === 'dark' ? DARK_WINDOW : DEFAULT_WINDOW);
  applyWindowColor(pick);
  pickerFrom(pick);
}

/* -- the picker -- */

var wheel = $('wheel'), wctx = wheel.getContext('2d');
var pickHsv = [0, 0, 1];

var PRESETS = ['#ffffff', '#f3ead3', '#dbe9f4', '#2f5d8a', '#3c6e47',
               '#7a2e3a', '#777777', '#1c2128'];

function drawWheel(){
  var w = wheel.width, r = w / 2, img = wctx.createImageData(w, w), d = img.data;
  var x, y, k = 0;
  for (y = 0; y < w; y++)
    for (x = 0; x < w; x++, k += 4){
      var dx = x - r + 0.5, dy = y - r + 0.5, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r){ d[k + 3] = 0; continue; }
      var c = hexToRgb(hsv((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360,
                           dist / r, pickHsv[2]));
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2];
      d[k + 3] = dist > r - 1 ? 255 * (r - dist) : 255;   /* soft edge */
    }
  wctx.putImageData(img, 0, 0);
  /* The marker is a black ring inside a white one, so it shows on any hue. */
  var a = pickHsv[0] * Math.PI / 180, mr = pickHsv[1] * (r - 1);
  var mx = r + Math.cos(a) * mr, my = r + Math.sin(a) * mr;
  wctx.lineWidth = 2;
  wctx.strokeStyle = '#fff';
  wctx.beginPath(); wctx.arc(mx, my, 7, 0, 2 * Math.PI); wctx.stroke();
  wctx.strokeStyle = '#000';
  wctx.beginPath(); wctx.arc(mx, my, 5, 0, 2 * Math.PI); wctx.stroke();
}

/** Point the controls at a colour without applying or saving it. */
function pickerFrom(hex){
  pickHsv = rgbToHsv(hexToRgb(hex));
  $('bright').value = Math.round(pickHsv[2] * 100);
  $('hex').value = hex;
  drawWheel();
}

/** Apply from the wheel/slider; `save` only when the gesture ends. */
function pickNow(save){
  var hex = hsv(pickHsv[0], pickHsv[1], pickHsv[2]);
  $('hex').value = hex;
  drawWheel();
  applyWindowColor(hex);
  if (save) saveWindowColor(hex);
}

function saveWindowColor(hex){
  api().set_window_color({color: hex})['catch'](function(){
    /* no host (browser preview): the colour still applies, it just is not kept */
  });
}

function setFromHex(hex, save){
  pickerFrom(hex);
  applyWindowColor(hex);
  if (save) saveWindowColor(hex);
}

function wheelAt(e){
  var b = wheel.getBoundingClientRect(), r = b.width / 2;
  var dx = e.clientX - b.left - r, dy = e.clientY - b.top - r;
  pickHsv[0] = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  pickHsv[1] = Math.min(1, Math.sqrt(dx * dx + dy * dy) / r);
  /* Choosing a hue at zero brightness would change nothing visible. */
  if (pickHsv[2] < 0.05){ pickHsv[2] = 0.5; $('bright').value = 50; }
  pickNow(false);
}

var dragging = false;
wheel.addEventListener('pointerdown', function(e){
  dragging = true;
  wheel.setPointerCapture(e.pointerId);
  wheelAt(e);
});
wheel.addEventListener('pointermove', function(e){ if (dragging) wheelAt(e); });
wheel.addEventListener('pointerup', function(){
  if (!dragging) return;
  dragging = false;
  saveWindowColor(windowColor);
});

$('bright').oninput = function(){ pickHsv[2] = $('bright').value / 100; pickNow(false); };
$('bright').onchange = function(){ saveWindowColor(windowColor); };

$('hex').onchange = function(){
  var v = $('hex').value.trim().toLowerCase();
  if (/^[0-9a-f]{6}$/.test(v)) v = '#' + v;
  if (/^#[0-9a-f]{6}$/.test(v)) setFromHex(v, true);
  else $('hex').value = windowColor;
};

$('colreset').onclick = function(){ setFromHex(DEFAULT_WINDOW, true); };

PRESETS.forEach(function(hex){
  var b = document.createElement('button');
  b.style.background = hex;
  b.title = hex;
  b.onclick = function(){ setFromHex(hex, true); };
  $('presets').appendChild(b);
});

function hidePicker(){ picker.classList.remove('on'); }

$('colorbtn').onclick = function(){

/** Host tells both windows when the folder or the auto-save flag changes. */
window.b360_settings_changed = function(saveDir, autosave){
  if (saveDir) $('capdirc').textContent = saveDir;
  if (autosave !== null && autosave !== undefined) $('capauto').checked = !!autosave;

/**
 * Host-driven link state. A detected loss puts the page back exactly as it
 * looked before connecting; the host keeps reconnecting behind it and reports
 * 'up' when it succeeds.
 */
window.b360_link_state = function(state, text){
  if (state === 'lost'){
    /* The indicator goes back to how it looks before a connection: grey dot,
       "not connected". It must never sit green over a link that is gone. The
       transcript carries the detail; the dot only says whether there is a link. */
    setConnected(false);
    writeLine('link lost — the board stopped answering. Reconnecting…', 'err');
  } else if (state === 'retry'){
    /* Deliberately silent: one line per attempt would bury the transcript, and
       the status already reads "not connected". The waveform window shows the
       attempt count, where it overwrites a single line instead of scrolling. */
  } else if (state === 'stale'){
    /* Nothing is sent to check, so this is not a claim that the board is gone --
       only that the last reply is text seconds old and nothing has confirmed it
       since. Input stays enabled: sending a command is how you find out. */
    if (connected) setState('open, last reply ' + text + 's ago', 'stale');
  } else if (state === 'fresh'){
    /* The counter stops, without claiming a reconnect that never happened. */
    if (connected) setState(text || 'connected', 'on');
  } else if (state === 'up'){
    setConnected(true, text);
    writeLine('reconnected to ' + text + ' — send ID to confirm the unit.', 'note');
  }
};

/** Python pushes progress and lifecycle events through here. */
window.b360_event = function(kind, text){
  if (kind === 'note')   writeLine(text, 'note');
  else if (kind === 'err') writeLine(text, 'err');
  else if (kind === 'out') write(clean(text));
};

/* --------------------------------------------------------------- csv reply --- */

/**
 * Pull waveform rows out of a reply, wherever they sit on the line.
 *
 * A row cannot simply be matched against a whole line, because the reply frame
 * puts other tokens on the same line as the data. One token per command is
 * concatenated with no separator, so
 *
 *     wc 10k; wg; ws; wr 0 4096
 *
 * comes back with its first row sharing a line with the earlier tokens:
 *
 *     OK; OK; DONE; 0.000000000,1.1507,0
 *
 * and a trailing command puts its token after the last row. Matching row-shaped
 * text anywhere in the line handles both. Anchoring on whole lines instead loses
 * sample 0 -- silently, because the viewer takes an unparseable first line for a
 * header.
 */
function extractCsv(body){
  var lines = body.split('\n'), out = [], i, m, re, found;
  for (i = 0; i < lines.length; i++){
    re = /(\d*\.?\d+(?:[eE][-+]?\d+)?)\s*,\s*(-?\d*\.?\d+)\s*,\s*([01])(?![\w.])/g;
    found = 0;
    while ((m = re.exec(lines[i])) !== null){
      out.push(m[1] + ',' + m[2] + ',' + m[3]);
      found++;
    }
    if (!found && out.length) break;      /* the data has ended */
  }
  return out;
}

function offerPlot(body, label, count){
  var n = count || body.split('\n').filter(function(l){ return l.trim(); }).length;
  var b = document.createElement('button');
  b.className = 'plot';
  b.textContent = 'Plot these ' + n + ' samples';
  b.onclick = function(){
    b.disabled = true;
    b.textContent = 'sent to the waveform window';
    api().plot_text({name: label, text: body}).catch(function(e){ fail('plot', e); });
  };
  var stick = atBottom();
  term.appendChild(b);
  term.appendChild(document.createTextNode('\n'));
  if (stick) term.scrollTop = term.scrollHeight;
}

/**
 * Save rows that came back from a hand-typed command, then offer to plot them.
 *
 * The host adds the header and the metadata comments, so a capture typed by hand
 * ends up indistinguishable from one taken with the Capture button.
 */
function keepCapture(rows, cmd){
  api().save_capture({rows: rows, command: cmd}).then(function(r){
    if (!r || !r.ok){
      writeLine('could not save the capture: ' + ((r && r.error) || 'unknown'), 'err');
      offerPlot(rows.join('\n'), 'console ' + stamp(), rows.length);
      return;
    }
    writeLine(r.saved ? 'saved ' + r.saved
                      : 'captured ' + rows.length + ' samples (auto-save is off)', 'note');
    offerPlot(r.csv, r.name, rows.length);
  })['catch'](function(e){
    fail('could not save the capture', e);
    offerPlot(rows.join('\n'), 'console ' + stamp(), rows.length);
  });
}

/* ---------------------------------------------------------------- commands --- */

function stamp(){
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2)
       + ':' + ('0' + d.getSeconds()).slice(-2);
}

function submit(){
  var line = $('entry').value;
  if (!connected || busy) return;

  /* An empty line is NOT a no-op. The firmware answers a line with no command on
     it with its model name, so a bare Enter asks what is on the other end --
     exactly what happens on Enter in PuTTY or TeraTerm. Blank lines are not
     worth remembering, so they stay out of the history. */
  if (line.trim() && cmdHistory[cmdHistory.length - 1] !== line) cmdHistory.push(line);
  histIdx = cmdHistory.length;
  pending = '';
  $('entry').value = '';

  writeLine('> ' + line, 'cmd');
  setBusy(true);
  api().send({line: line}).then(function(r){
    setBusy(false);
    if (!r.ok){ writeLine(r.error, 'err'); if (r.closed) setConnected(false); return; }
    var body = clean(r.reply).replace(/^\n+/, '').replace(/\n+$/, '');
    if (body) writeLine(body);

    /* Typed waveform commands get the same treatment as the Capture button:
       the rows are saved with metadata, not just offered for plotting. Only
       where there is a viewer -- without waveform acquisition a reply that
       happens to hold three numbers is just text. */
    if (hasPanel('waveform')){
      var rows = extractCsv(body);
      if (rows.length >= 2) keepCapture(rows, line);
    }
  }).catch(function(e){ setBusy(false); fail('send failed', e); });
}

/* ------------------------------------------------------------------ wiring --- */

$('entry').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); submit(); return; }
  if (e.key === 'ArrowUp'){
    if (!cmdHistory.length) return;
    e.preventDefault();
    if (histIdx === cmdHistory.length) pending = $('entry').value;
    histIdx = Math.max(0, histIdx - 1);
    $('entry').value = cmdHistory[histIdx];
    return;
  }
  if (e.key === 'ArrowDown'){
    if (histIdx >= cmdHistory.length) return;
    e.preventDefault();
    histIdx++;
    $('entry').value = histIdx === cmdHistory.length ? pending : cmdHistory[histIdx];
  }
});

/* Ctrl+C already works; this is the same thing for people who reach for the
   mouse. WebView2 suppresses its own context menu unless pywebview is running in
   debug (AreDefaultContextMenusEnabled), so the page supplies one. */
var ctx = $('ctx');

/** The current selection, but only if it lies inside the transcript. */
function termSelection(){
  var sel = window.getSelection();
  if (!sel || sel.isCollapsed) return '';
  var node = sel.anchorNode;
  while (node && node !== term) node = node.parentNode;
  return node === term ? sel.toString() : '';
}

function hideCtx(){ ctx.classList.remove('on'); }

term.addEventListener('contextmenu', function(e){
  e.preventDefault();
  ctx.querySelector('[data-act="copy"]').disabled = (termSelection() === '');
  ctx.classList.add('on');
  /* measured after it is shown, so it can be kept on screen near an edge */
  var x = Math.min(e.clientX, window.innerWidth  - ctx.offsetWidth  - 6);
  var y = Math.min(e.clientY, window.innerHeight - ctx.offsetHeight - 6);
  ctx.style.left = Math.max(0, x) + 'px';
  ctx.style.top  = Math.max(0, y) + 'px';
});

/* Without this the press clears the selection before Copy can act on it. */
ctx.addEventListener('mousedown', function(e){ e.preventDefault(); });

ctx.addEventListener('click', function(e){
  var act = e.target.getAttribute('data-act');
  if (act === 'copy') copySelection();
  else if (act === 'selall'){
    var r = document.createRange();
    r.selectNodeContents(term);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
  hideCtx();
});

function copySelection(){
  if (termSelection() === '') return;
  /* execCommand is deprecated, but it is what works from a file:// page: the
     async clipboard API wants a secure context and WebView2 does not call this
     one. Kept as the fallback for anything that does. */
  var done = false;
  try { done = document.execCommand('copy'); } catch (err) { done = false; }
  if (done) return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(termSelection())['catch'](function(){
      writeLine('could not copy to the clipboard', 'err');
    });
  } else {
    writeLine('could not copy to the clipboard', 'err');
  }
}

window.addEventListener('mousedown', function(e){
  if (!ctx.contains(e.target)) hideCtx();
});
window.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideCtx(); });

/* ------------------------------------------------------------------- boot --- */

/* Controls that do nothing without the host process. */
var HOST_ONLY = ['connect', 'kind', 'rescan', 'plotwin', 'eol',
                 'capdirbtn', 'capauto'];

var bridgeless = false;

/** No host process: explain it once, and stop offering controls that cannot
    work. The viewer page has no such limit, so point at it. */
function browserMode(){
  if (bridgeless || (window.pywebview && window.pywebview.api)) return;
  bridgeless = true;
  HOST_ONLY.forEach(function(id){ if ($(id)) $(id).disabled = true; });
  setState('browser \u2014 no link', '');
  writeLine('This page is open in a web browser.', 'err');
  writeLine('A browser cannot open a TCP or serial connection, so the terminal '
          + 'cannot reach the board from here. Connecting would stall, so the '
          + 'controls are disabled.', 'note');
  writeLine('For the terminal' + (hasPanel('waveform') ? ' and one-click capture'
            : '') + ', run {{BINARY}}.', 'note');
  if (hasPanel('waveform'))
    writeLine('To stay entirely in the browser: run wc/wg/ws/wr in whatever '
            + 'terminal is approved on your machine, then open '
            + 'b360_wave_viewer.html and paste or drop the CSV. That page needs '
            + 'no connection and nothing installed.', 'note');
}

/** Hide what an absent panel owns. Done once, from the host's answer. */
function applyPanels(list){
  panelsOn = list || [];
  var owned = {waveform: ['plotwin', 'capbar', 'wfhint']};
  Object.keys(owned).forEach(function(id){
    if (hasPanel(id)) return;
    owned[id].forEach(function(el){ if ($(el)) $(el).hidden = true; });
  });
}

function boot(){
  if (bridgeless){                 /* the host arrived after the grace period */
    bridgeless = false;
    term.textContent = '';
    HOST_ONLY.forEach(function(id){ if ($(id)) $(id).disabled = false; });
    setConnected(false);
  }
  api().get_defaults({}).then(function(d){
    if (d.panels) applyPanels(d.panels);
    if (d.appearance === 'wheel') applyAppearance('wheel', d.window_color, d.theme);
    else if (d.theme) setTheme(d.theme);
    if (d.save_dir) $('capdirc').textContent = d.save_dir;
    if (d.autosave !== undefined) $('capauto').checked = d.autosave !== false;
    if (d.activity_log !== undefined) applyActivityLog(d.activity_log !== false);
    if (d.host) $('host').value = d.host;
    if (d.port) $('port').value = d.port;
    if (d.eol_tcp) eolDefaults.tcp = d.eol_tcp;
    if (d.eol_serial) eolDefaults.serial = d.eol_serial;
    if (d.eol) { $('eol').value = d.eol; eolPinned = true; }
    if (d.kind) { $('kind').value = d.kind; $('kind').onchange(); }
    writeLine('{{PRODUCT}} console ready. Connect to begin.', 'note');
    writeLine('The board allows one connection at a time — close PuTTY or '
            + 'TeraTerm first.', 'note');
  }).catch(function(){
    writeLine('{{PRODUCT}} console ready. Connect to begin.', 'note');
  });
}

/* The bridge may not be up yet -- or may never be, if this file was opened in
   a browser, where pywebviewready never fires at all. Wait a beat, then say so
   plainly rather than leaving a page that looks alive and is not. */
if (window.pywebview && window.pywebview.api) boot();
else {
  window.addEventListener('pywebviewready', boot);
  setTimeout(browserMode, 1500);
}
</script>
</body>
</html>
